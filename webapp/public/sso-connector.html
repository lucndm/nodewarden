<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>NodeWarden SSO Connector</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      p {
        max-width: 420px;
        padding: 12px 16px;
        border-radius: 10px;
        background: #eef4ff;
        color: #1f2937;
        font-size: 14px;
        line-height: 1.5;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <p id="sso-status" aria-live="polite">Completing sign-in…</p>
    <script type="module" src="/sso-connector.js"></script>
  </body>
</html>
