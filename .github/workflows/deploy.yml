name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy only reads the repository, and it is the only workflow that names
# the production environment, so it is the only one that can read the
# Cloudflare credentials.
#
# No Cloudflare credential is stored in GitHub. The deploy job asks GitHub for
# a short-lived OIDC token and trades it at Infisical for the two Cloudflare
# values. Infisical only accepts a token whose subject is this repository's
# "production" environment, so no other job, branch environment or fork can
# read them. The Infisical side (project ci-nodewarden, identity, OIDC rule)
# lives in OpenTofu: infrastructure/infisical/ci-consumers.tf in the
# docker-compose repo.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-nodewarden
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The deploy is the last step, not the only one. These are the offline
      # contract tests: the vault layout, the tags and folders, the item
      # history, the rights on a shared item. A change that breaks one of them
      # must not reach production.
      - name: Test
        run: npm run test:unit

      # The deploy does not touch secrets. Cloudflare refuses a secret edit
      # while the newest version of the worker is not the deployed one, which
      # happens right after a deploy, so writing the secret here turned a
      # successful deploy into a failed run. The secret is set once, by hand in
      # the dashboard, and this step only reports what is there.
      # Fetched after the tests, so only the deploy step runs with the
      # Cloudflare values in its environment. The action masks every value it
      # exports.
      - name: Fetch Cloudflare credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          domain: https://infisical.minhluc.info
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://infisical.minhluc.info
          project-slug: ci-nodewarden
          env-slug: prod
          secret-path: /
          export-type: env

      - name: Deploy worker
        run: |
          npx wrangler deploy
          npx wrangler secret list

      # The vault is not read back here on purpose. This repository is public,
      # so a CI log is a public log: anything the runner prints about the
      # running vault is published. The audit runs from a machine that holds
      # the credentials, and its output stays there.
