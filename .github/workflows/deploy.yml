name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy only reads the repository, and it is the only workflow that names
# the production environment, so it is the only one that can read the
# Cloudflare credentials.
#
# No Cloudflare credential is stored in GitHub. The deploy job asks GitHub for
# a short-lived OIDC token and trades it at Infisical for the two Cloudflare
# values. Infisical only accepts a token whose subject is this repository's
# "production" environment, so no other job, branch environment or fork can
# read them. The Infisical side (project ci-nodewarden, identity, OIDC rule)
# lives in OpenTofu: infrastructure/infisical/ci-consumers.tf in the
# docker-compose repo.
permissions:
  contents: read

concurrency:
  group: deploy-nodewarden
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Lets this job ask GitHub for the OIDC token it trades at Infisical.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The deploy is the last step, not the only one. These are the offline
      # contract tests: the vault layout, the tags and folders, the item
      # history, the rights on a shared item. A change that breaks one of them
      # must not reach production.
      - name: Test
        run: npm run test:unit

      # The Cloudflare token exists only inside this one step, as shell
      # variables of this script: it is never written to GITHUB_ENV, so no
      # later step or post-step of another action sees it. Nothing from
      # Infisical but an error message is printed, and the values are masked
      # in case a tool echoes them.
      #
      # The build ran above, without the token. wrangler.toml has a [build]
      # section that would run the whole npm build chain again inside
      # `wrangler deploy`, with the token in its environment; a copy of the
      # config without that section makes wrangler deploy the dist/ that is
      # already there.
      #
      # The deploy does not touch secrets. Cloudflare refuses a secret edit
      # while the newest version of the worker is not the deployed one, which
      # happens right after a deploy, so writing the secret here turned a
      # successful deploy into a failed run. The secret is set once, by hand,
      # and this step only counts what is there: the names stay out of the
      # public log.
      - name: Deploy worker
        env:
          INFISICAL_URL: https://infisical.minhluc.info
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          set -euo pipefail
          jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$INFISICAL_URL" | jq -r .value)
          echo "::add-mask::$jwt"
          login=$(curl -sS -X POST -H 'content-type: application/json' \
            -d "$(jq -n --arg i "$INFISICAL_IDENTITY_ID" --arg j "$jwt" '{identityId:$i, jwt:$j}')" \
            "$INFISICAL_URL/api/v1/auth/oidc-auth/login")
          token=$(jq -r '.accessToken // empty' <<<"$login")
          if [ -z "$token" ]; then jq -r .message <<<"$login"; exit 1; fi
          echo "::add-mask::$token"
          body=$(mktemp)
          code=$(curl -sS -G -o "$body" -w '%{http_code}' -H "Authorization: Bearer $token" \
            --data-urlencode "workspaceId=$INFISICAL_PROJECT_ID" \
            --data-urlencode environment=prod --data-urlencode secretPath=/ \
            "$INFISICAL_URL/api/v3/secrets/raw")
          if [ "$code" != 200 ]; then echo "HTTP $code"; jq -r .message "$body"; rm -f "$body"; exit 1; fi
          pick() { jq -r --arg k "$1" '.secrets[] | select(.secretKey == $k) | .secretValue' "$body"; }
          CLOUDFLARE_API_TOKEN=$(pick CLOUDFLARE_API_TOKEN)
          CLOUDFLARE_ACCOUNT_ID=$(pick CLOUDFLARE_ACCOUNT_ID)
          rm -f "$body"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Infisical project is missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID"; exit 1
          fi
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID

          sed '/^\[build\]$/,/^$/d' wrangler.toml > wrangler.deploy.toml
          if grep -q '^\[build\]' wrangler.deploy.toml; then echo "[build] still in deploy config"; exit 1; fi
          npx wrangler deploy --config wrangler.deploy.toml
          count=$(npx wrangler secret list --config wrangler.deploy.toml --format json 2>/dev/null | jq length) || count=unknown
          echo "worker secrets: $count"
          rm -f wrangler.deploy.toml

      # The vault is not read back here on purpose. This repository is public,
      # so a CI log is a public log: anything the runner prints about the
      # running vault is published. The audit runs from a machine that holds
      # the credentials, and its output stays there.
