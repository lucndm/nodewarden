name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nodewarden
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The deploy does not touch secrets. Cloudflare refuses a secret edit
      # while the newest version of the worker is not the deployed one, which
      # happens right after a deploy, so writing the secret here turned a
      # successful deploy into a failed run. The secret is set once, by hand in
      # the dashboard, and this step only reports what is there.
      - name: Deploy worker
        run: |
          npx wrangler deploy
          npx wrangler secret list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A deploy can carry a change that breaks the vault layout, so the vault
      # is read back after it. The audit only prints counts and the repair
      # marker, never vault content, and it writes nothing.
      - name: Audit the production vault
        run: node scripts/prod-vault-audit.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
