name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nodewarden
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The worker is deployed first and the secret is written afterwards.
      # Cloudflare refuses a secret edit while the newest version of the worker
      # is not the deployed one, so writing the secret first makes the deploy
      # fail whenever a previous run left a newer undeployed version behind.
      - name: Deploy worker
        run: |
          npx wrangler deploy
          if [ -n "$TELEGRAM_CHAT_ID" ]; then
            printf '%s' "$TELEGRAM_CHAT_ID" | npx wrangler secret put TELEGRAM_CHAT_ID
          fi
          npx wrangler secret list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # A deploy can carry a change that breaks the vault layout, so the vault
      # is read back after it. The audit only prints counts and the repair
      # marker, never vault content, and it writes nothing.
      - name: Audit the production vault
        run: node scripts/prod-vault-audit.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
