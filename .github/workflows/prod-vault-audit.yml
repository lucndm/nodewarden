name: prod vault audit

# Read-only check of the production vault, straight from D1. It prints counts
# and the repair marker only; no vault content leaves the runner. Run it by
# hand before and after a change that touches the vault.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-vault-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit the production vault
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prod-vault-audit.mjs
