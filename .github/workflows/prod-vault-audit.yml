name: prod vault audit

# Read-only check of the production vault, straight from D1. It prints counts
# and the repair marker only; no vault content leaves the runner. Run it by
# hand before and after a change that touches the vault.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-vault-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    # The production secrets live in this environment, so they are only
    # exposed to a job that runs here.
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Audit the production vault
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prod-vault-audit.mjs
